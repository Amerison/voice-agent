app = "voice-agent-glazia"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_FILE = "/data/store.json"

# The store is a single JSON file, so it needs a volume to survive deploys.
[mounts]
  source = "voice_agent_data"
  destination = "/data"

# Kept running so Vapi's mid-call tool webhooks never wait on a cold start.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
