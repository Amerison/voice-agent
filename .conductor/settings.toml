"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "flutter pub get && (cd server && dart pub get)"
run_mode = "concurrent"

[scripts.run.server]
available_in = [ "local" ]
command = "set -a; source .env; set +a; export PORT=${CONDUCTOR_PORT:-8080}; cd server; dart run bin/server.dart"
icon = "server"

[scripts.run.ios]
available_in = [ "local" ]
command = "flutter run --dart-define=API_BASE_URL=http://127.0.0.1:${CONDUCTOR_PORT:-8080}"
icon = "smartphone"
